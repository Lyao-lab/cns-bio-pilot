# compat.yaml — SINGLE SOURCE OF TRUTH for package version compatibility
#
# All skill docs reference THIS file for version info (not hardcoded version
# strings). When a package upgrades, update verified_against here, then run:
#   python scripts/api_check.py --diff
# to see exactly what changed and which files need updating.
#
# Rules:
#   - verified_against: the version that was last fully verified via api_check
#   - compatible_range: expected safe range (minor bumps usually OK, major may break)
#   - breaking_changes: known breaking changes between versions (added after each upgrade)
#   - last_verified: date of last api_check run against this version

omicverse:
  verified_against: "2.3.1"
  compatible_range: ">=2.2.0, <2.4"
  last_verified: "2026-07-31"
  breaking_changes:
    "2.2.3 -> 2.2.4": "none (patch); GASTON newly wrapped; synbio/Agent modules added"
    "2.2.4 -> 2.3.1": "none breaking for skill APIs; new modules ov.agent/ov.airr (out of skill scope); 8280 new exports (agent+airr)"

